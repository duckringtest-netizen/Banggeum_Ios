name: Banggeum

options:
  bundleIdPrefix: duckring.banggeum
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    PRODUCT_BUNDLE_IDENTIFIER: duckring.banggeum.com
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

# v1 은 순수 SwiftUI mock — 외부 패키지 없음.
# 이미지는 내장 AsyncImage 사용. 통합 단계에서 supabase-swift 추가.

targets:
  Banggeum:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Banggeum
    info:
      path: Banggeum/Info.plist
      properties:
        CFBundleDisplayName: 방금
        CFBundleName: Banggeum
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        # 따뜻한 라이트 톤 고정 (파란 부동산 감성 배제)
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false

schemes:
  Banggeum:
    build:
      targets:
        Banggeum: all
